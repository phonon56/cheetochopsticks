};function pickJur(q){
  var s = q.toLowerCase()
    .replace(/,\s*/g, ' ')
    .replace(/\./g, '')
    .replace(/\s+/g, ' ')
    .trim();

  // ── Lorson Ranch / Fort Carson southeast corridor ────────
  if (/lorson|drennan|bragdon|bradley rd|st charles mesa|enoch rd/.test(s)) return JUR.lorson;
  if (/fountain.*(co|colorado)/.test(s) && /ranch|metro|md\s*[1-7]/.test(s)) return JUR.lorson;

  // ── Manitou Springs ──────────────────────────────────────
  if (/manitou|ruxton|pikes peak ave|crystal park|ute pass/.test(s)) return JUR.manitou;

  // ── Monument / Palmer Lake (northern EPC) ────────────────
  if (/monument|palmer lake|gleneagle|baptist rd|higby|leather chaps|misty acr|donala/.test(s)) return JUR.monument;
  if (/\bhwy\s*105\b|highway 105|struthers/.test(s)) return JUR.monument;

  // ── Black Forest ─────────────────────────────────────────
  if (/black forest|shoup|vollmer|meridian rd.*(north|palmer)|roller coaster/.test(s)) return JUR.blackforest;
  if (/rangewood|hodgen|teaching tree|fox run/.test(s)) return JUR.blackforest;

  // ── Woodmen Hills / Meridian Ranch (eastern unincorp) ────
  if (/woodmen hills|meridian ranch|meridian rd.*(falcon|peyton)|peyton hwy/.test(s)) return JUR.woodmen;

  // ── Briargate / Wolf Ranch / northern COS ────────────────
  if (/briargate|wolf ranch|banning lewis|research pkwy|voyager|interquest|chapel hills|chapel ridge|sand creek/.test(s)) return JUR.briargate;
  if (/4.way ranch|4way ranch|meridian village|tc[3\s]*pkwy|rangewood.*cos/.test(s)) return JUR.briargate;

  // ── Falcon / Peyton / eastern EPC ───────────────────────
  if (/falcon|peyton|calhan|ellicott|cimarron hills|meridian.*east|airport rd|antelope meadows/.test(s)) return JUR.falcon;
  if (/\bsd.?49\b|d49|district 49/.test(s)) return JUR.falcon;

  // ── Security-Widefield ───────────────────────────────────
  if (/security|widefield|fontaine|widefield.*blvd|security.*blvd/.test(s)) return JUR.widefield;

  // ── Fountain (city) ──────────────────────────────────────
  if (/\bfountain\b/.test(s) && !/banning lewis|fountain.*metro|fountain.*ranch/.test(s)) return JUR.fountain;
  if (/\bhwy\s*85\b|\bus.?85\b|highway 85/.test(s)) return JUR.fountain;

  // ── Colorado Springs city — specific named areas ─────────
  if (/old colorado city|downtown cos|tejon|nevada.*south|el paso.*blvd/.test(s)) return JUR.csprings;
  if (/\bmanual\b|south.*cos|venetucci|corson/.test(s)) return JUR.csprings;

  // ── Default: Colorado Springs city ───────────────────────
  // Most EPC searches that don't match above are COS city
  if (/colorado springs|cos\b|colo spr/.test(s)) return JUR.csprings;

  // Very generic — if nothing matched, default COS with a caveat
  return JUR.csprings;
}
